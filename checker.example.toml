# gso-checker configuration example. Copy to checker.toml (git-ignored) and edit.
# All paths are read-only inputs EXCEPT data_dir and backups (checker-owned) and
# live_mod, which only `install` / `uninstall` write after typed confirmation.
# Use forward slashes. Relative paths resolve against this file's folder.

[checker]
data_dir = "C:/Users/BigBoss1/AppData/Local/gso-checker"   # checker.db + reports/
profile  = "EUREX-1.5"                                     # profile everything is checked under
rules    = "rules/rules_phase1.json"

[profiles."EUREX-1.5"]
description = "GSO on Divide and Conquer EUR / EUREX 1.5 with M2EX"

[profiles."EUR-2.085-EUREX-1.4.2"]
description = "History only: public 0.5.2 game-root package. Never mixed with EUREX-1.5."

[game]
root          = "D:/SteamLibrary/steamapps/common/Medieval II Total War"   # READ-ONLY for every command but install/uninstall
exe           = "M2EX.exe"
profile       = "EUREX-1.5"            # declared installation profile (gate check 'profile')
mod_folder    = "Divide_and_Conquer_EUR"
# live_mod    = "D:/.../mods/Divide_and_Conquer_EUR"   # default: <root>/mods/<mod_folder>
process_names = ["M2EX.exe", "medieval2.exe", "kingdoms.exe"]

[repo]
overlay        = "E:/GSO_checker_addendum_A/repo/overlay_ae4f6169.zip"   # folder or git-archive zip
overlay_prefix = "overlay/"                                              # stripped from zip members ("" for a folder)
not_installed  = ["README.txt", "SHARED.txt"]                            # repo docs, never shipped
tools          = ""                                                      # phase 2 (existing gates)

[eur_baseline]
path    = ""            # MISSING: no immutable pre-GSO EUR snapshot exists yet -> V06 UNKNOWN, install blocked
profile = "EUREX-1.5"

[backups]
path = "E:/GSO_checker_backups"    # must be outside the game folder

[ownership]
# GSO-owned install-relative paths (V05 untracked-file scan; V06 treats everything else as possibly EUR-owned).
gso_owned = [
  "script/eur40/**",
  "GSO/**",
  "GSO_Uninstall.bat",
  "GSO_Clean.bat",
  "README_GSO.txt",
  "eopData/images/eur40_*",
  "eopData/sounds/eur40_*",
]

[policy]
block_extras    = false     # V05: true -> untracked owned live files FAIL instead of INFO
text_extensions = [".nut", ".txt", ".cfg", ".bat", ".json", ".lua", ".ini", ".xml", ".csv", ".md"]

